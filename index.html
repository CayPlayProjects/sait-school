    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>

        a, button, .product-card, .tab-pill, .icon-btn, .user-avatar, .feature-card, .feature-icon, input, select, textarea, .chat-msg, .order-card, .review-card, .ud-item, .review-mini, .stat-item, .modal-product-image, .product-image, .product-img, .btn, .chat-list-item, .sort-select, .category-select, .price-input, .form-input, .team-tab, .theme-select-wrap, .pay-method, .wallet-card, .balance-badge, .role-filter-pill, .image-upload-area { cursor: none; }

        .noise { position: fixed; inset: 0; z-index: -1; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events: none; }

        .fc-glow-2 { bottom: 20%; right: 10%; background: rgba(168,85,247,0.3); }

        .section { padding: 3rem 0; }

    addTransaction(userId, 'deposit', amount, `Пополнение через ${method}`, 'main');
    return true;
}
function withdrawFromBalance(userId, amount, method, requisites) {
    const user = getUsers().find(u => u.id === userId);
    if (!user) return { error: 'Пользователь не найден' };
    if ((user.balance || 0) < amount) return { error: 'Недостаточно средств' };
    if (amount < 10) return { error: 'Минимум 10₽' };
    updateUserBalance(userId, 'main', -amount);
    addTransaction(userId, 'withdraw', -amount, `Вывод на ${method}: ${requisites}`, 'main');
    const reqs = getWithdrawRequests();
    reqs.unshift({ id: genId('wr'), userId, amount, method, requisites, status: 'pending', time: Date.now() });
    DB.set('withdraw_requests', reqs);
    return { success: true };
}
function processOrderPayment(order) {
    const settings = getSettings();
    const commission = Math.round(order.productPrice * (settings.commissionPercent || 15) / 100);
    const workerEarns = order.productPrice - commission;
    const superAdmin = getUsers().find(u => u.role === 'superadmin');
    if (superAdmin) { updateUserBalance(superAdmin.id, 'main', commission); addTransaction(superAdmin.id, 'commission', commission, `Комиссия ${settings.commissionPercent}% с "${order.productName}"`, 'main'); }
    if (order.workerId) { updateUserBalance(order.workerId, 'worker', workerEarns); addTransaction(order.workerId, 'order_income', workerEarns, `Оплата за "${order.productName}"`, 'worker'); }
}

function login(username, password) {
    const users = getUsers();
    const user = users.find(u => u.username === username);
    if (!user) return null;
    let passOk = false;
    if (user.passwordHash) { passOk = user.passwordHash === hashPassword(password); }
    else if (user.password !== undefined) { passOk = user.password === password; }
    if (!passOk) return null;
    state.currentUser = user;
    DB.set('currentUser', user);
    return user;
}
function register(data) {
    const users = getUsers();
    if (users.find(u => u.username === data.username)) return { error: 'Логин уже занят' };
    const newUser = { id: genId('u'), username: data.username, passwordHash: hashPassword(data.password), role: 'user', name: data.name || data.username, telegram: data.telegram || '', avatar: null, balance: 0, workerBalance: 0, createdAt: Date.now() };
    users.push(newUser);
    DB.set('users', users);
    state.currentUser = newUser;
    DB.set('currentUser', newUser);
    return { user: newUser };
}
function changePassword(currentPwd, newPwd) {
    const user = getCurrentUser();
    if (!user) return { error: 'Не авторизован' };
    let passOk = false;
    if (user.passwordHash) passOk = user.passwordHash === hashPassword(currentPwd);
    else if (user.password !== undefined) passOk = user.password === currentPwd;
    if (!passOk) return { error: 'Неверный текущий пароль' };
    if (newPwd.length < 4) return { error: 'Пароль слишком короткий' };
    const users = getUsers();
    const idx = users.findIndex(u => u.id === user.id);
    users[idx].passwordHash = hashPassword(newPwd);
    delete users[idx].password;
    DB.set('users', users);
    state.currentUser = users[idx];
    DB.set('currentUser', users[idx]);
    return { success: true };
}
function logout() { state.currentUser = null; DB.set('currentUser', null); navigate('home'); showToast('Вы вышли из аккаунта', 'info'); }

function createOrder(productId) {
    const user = getCurrentUser();
    if (!user) { showToast('Войдите в аккаунт', 'error'); navigate('login'); return; }
    if (user.role !== 'user') { showToast('Только покупатели могут заказывать', 'error'); return; }
    const product = getProducts().find(p => p.id === productId);
    if (!product) return;
    if ((user.balance || 0) < product.price) { showToast(`Недостаточно средств! Нужно ${product.price}₽`, 'error'); return; }
    updateUserBalance(user.id, 'main', -product.price);
    addTransaction(user.id, 'order_payment', -product.price, `Оплата "${product.name}"`, 'main');
    const order = { id: genId('o'), userId: user.id, workerId: null, productId: product.id, productName: product.name, productIcon: product.icon, productPrice: product.price, status: 'pending', chat: [{ from: 'system', text: 'Заказ создан. Ожидайте назначения работника.', time: Date.now() }], review: null, createdAt: Date.now(), completedAt: null };
    const orders = getOrders();
    orders.unshift(order);
    DB.set('orders', orders);
    showToast('Заказ оплачен!', 'success');
    state.currentChatId = order.id;
    navigate('chats');
}
function assignWorker(orderId, workerId) {
    const orders = getOrders();
    const order = orders.find(o => o.id === orderId);
    if (!order) return;
    order.workerId = workerId; order.status = 'assigned';
    order.chat.push({ from: 'system', text: 'Работник назначен.', time: Date.now() });
    DB.set('orders', orders);
    showToast('Работник назначен', 'success');
    renderCurrentPage();
}
function workerCompleteOrder(orderId) {
    const orders = getOrders();
    const order = orders.find(o => o.id === orderId);
    if (!order) return;
    order.status = 'worker_done';
    order.chat.push({ from: 'system', text: '⚡ Работник выполнил заказ!', time: Date.now() });
    DB.set('orders', orders);
    showToast('Заказ отмечен как выполненный', 'success');
    renderCurrentPage();
}
function buyerConfirmOrder(orderId) {
    const orders = getOrders();
    const order = orders.find(o => o.id === orderId);
    if (!order || order.status !== 'worker_done') return;
    order.status = 'completed'; order.completedAt = Date.now();
    order.chat.push({ from: 'system', text: '✅ Заказ завершён!', time: Date.now() });
    DB.set('orders', orders);
    processOrderPayment(order);
    showToast('Спасибо! Оставьте отзыв 📝', 'success');
    openReviewModal(orderId);
    renderCurrentPage();
}
function sendMessage(orderId, text) {
    const orders = getOrders();
    const order = orders.find(o => o.id === orderId);
    if (!order) return;
    const user = getCurrentUser();
    if (!user) return;
    order.chat.push({ from: user.id, text, time: Date.now() });
    DB.set('orders', orders);
}

/* 🔄 ИСПРАВЛЕНО: курсор работает корректно */
function initCursor() {
    const ring = $('#cursorRing'); const dot = $('#cursorDot');
    if (!ring || !dot) return;
    let mouseX = 0, mouseY = 0, ringX = 0, ringY = 0;
    let isHovering = false;
    
    document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; dot.style.left = mouseX + 'px'; dot.style.top = mouseY + 'px'; });
    
    function animateRing() {
        ringX += (mouseX - ringX) * 0.2;
        ringY += (mouseY - ringY) * 0.2;
        ring.style.left = ringX + 'px';
        ring.style.top = ringY + 'px';
        requestAnimationFrame(animateRing);
    }
    animateRing();
    
    // Список интерактивных элементов
    const interactiveSelector = 'a, button, .product-card, .tab-pill, .icon-btn, .user-avatar, .feature-card, input, select, textarea, .order-card, .review-card, .ud-item, .chat-msg, .btn, .chat-list-item, .sort-select, .category-select, .price-input, .form-input, .team-tab, .theme-select-wrap, .pay-method, .wallet-card, .balance-badge, .role-filter-pill, .image-upload-area, .modal-overlay';
    
    document.addEventListener('mouseover', (e) => {
        const t = e.target.closest(interactiveSelector);
        if (t && !isHovering) {
            isHovering = true;
            ring.classList.add('hover');
            dot.classList.add('hover');
        }
    });
    document.addEventListener('mouseout', (e) => {
        const t = e.target.closest(interactiveSelector);
        if (t) {
            // Проверяем что мышь действительно ушла с интерактивного элемента
            const related = e.relatedTarget;
            if (!related || !related.closest(interactiveSelector)) {
                isHovering = false;
                ring.classList.remove('hover');
                dot.classList.remove('hover');
            }
        }
    });
    document.addEventListener('mousedown', () => ring.classList.add('click'));
    document.addEventListener('mouseup', () => ring.classList.remove('click'));
    
    // Прячем курсор когда мышь уходит со страницы
    document.addEventListener('mouseleave', () => { ring.classList.add('cursor-hidden'); dot.classList.add('cursor-hidden'); });
    document.addEventListener('mouseenter', () => { ring.classList.remove('cursor-hidden'); dot.classList.remove('cursor-hidden'); });
}

function navigate(page, params = {}) {
    state.currentPage = page;
    if (params.chatId) state.currentChatId = params.chatId;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    renderCurrentPage();
}
function renderCurrentPage() {
    renderNavbar();
    renderFooter();
    const c = $('#pageContent');
    const page = state.currentPage;
    if (page === 'home') c.innerHTML = renderHome();
    else if (page === 'catalog') c.innerHTML = renderCatalog();
    else if (page === 'reviews') c.innerHTML = renderReviewsPage();
    else if (page === 'contact') c.innerHTML = renderContactPage();
    else if (page === 'favorites') c.innerHTML = renderFavoritesPage();
    else if (page === 'login') c.innerHTML = renderLogin();
    else if (page === 'register') c.innerHTML = renderRegister();
    else if (page === 'profile') c.innerHTML = renderProfile();
    else if (page === 'my-orders') c.innerHTML = renderMyOrders();
    else if (page === 'worker-orders') c.innerHTML = renderWorkerOrders();
    else if (page === 'worker-apply') c.innerHTML = renderWorkerApply();
    else if (page === 'chats') c.innerHTML = renderChats();
    else if (page === 'admin') c.innerHTML = renderAdmin();
    else c.innerHTML = renderHome();
    bindPageEvents();
}

function renderCatalog() {
    const products = getProducts();
    const categories = [
        { id: 'all', name: 'Все', icon: 'fa-th' },
        { id: 'fruits', name: 'Фрукты', icon: 'fa-apple-alt' },
        { id: 'raids', name: 'Рейды', icon: 'fa-skull' },
        { id: 'boosts', name: 'Прокачка', icon: 'fa-rocket' },
        { id: 'bounty', name: 'Фарм баунти', icon: 'fa-coins' },
    ];
    let list = state.currentCategory === 'all' ? products : products.filter(p => p.cat === state.currentCategory);
    if (state.currentSort === 'price-asc') list = [...list].sort((a, b) => a.price - b.price);
    else if (state.currentSort === 'price-desc') list = [...list].sort((a, b) => b.price - a.price);
    else if (state.currentSort === 'rating') list = [...list].sort((a, b) => getProductRating(b.id).rating - getProductRating(a.id).rating);
    else if (state.currentSort === 'popular') list = [...list].sort((a, b) => getProductRating(b.id).count - getProductRating(a.id).count);
    const user = getCurrentUser();
    const userBalance = user ? (user.balance || 0) : 0;
    return `
        <section class="section">
            <div class="section-head">
                <div>
                    <h2 class="section-title">Каталог <span class="accent">услуг</span></h2>
                    <p class="section-subtitle">${user ? `Ваш баланс: <strong style="color:var(--green);">${formatMoney(userBalance)}</strong>` : 'Войдите чтобы покупать'}</p>
                </div>
            </div>
            <div class="filters-bar">
                ${categories.map(c => `<button class="tab-pill ${state.currentCategory === c.id ? 'active' : ''}" data-cat="${c.id}"><i class="fas ${c.icon}"></i> ${c.name}</button>`).join('')}
                <div class="filter-spacer"></div>
                <div class="theme-select-wrap">
                    <select class="sort-select" id="sortSelect">
                        <option value="default">По умолчанию</option>
                        <option value="popular">По популярности</option>
                        <option value="price-asc">Цена ↑</option>
                        <option value="price-desc">Цена ↓</option>
                        <option value="rating">По рейтингу</option>
                    </select>
                </div>
            </div>
            <div class="products-grid">${list.length === 0 ? '<div class="empty-state"><i class="fas fa-box-open"></i><h3>Пусто</h3></div>' : list.map((p, i) => renderProductCard(p, i)).join('')}</div>
        </section>
    `;
}

function renderProductCard(p, i) {
    const { rating, count } = getProductRating(p.id);
    const oldPrice = p.oldPrice ? `<span style="text-decoration:line-through; color:var(--text-3); font-size:0.85rem;">${p.oldPrice} ₽</span>` : '';
    const stockStatus = p.stock > 0 ? 'in' : 'out';
    const stockText = p.stock > 0 ? 'В наличии' : 'Нет в наличии';
    const user = getCurrentUser();
    const canAfford = user && (user.balance || 0) >= p.price;
    return `
        <div class="product-card glass" style="--card-index: ${i}" data-product-id="${p.id}">
            <div class="product-image ${p.cat}">
                <div class="product-badges">
                    ${p.badges.map(b => `<span class="p-badge ${b}">${b === 'sale' ? '🔥 -' + Math.round((1 - p.price / p.oldPrice) * 100) + '%' : b === 'leg' ? '👑 Легенда' : b === 'epic' ? '⚡ Эпик' : b === 'hot' ? '🔥 Хит' : '✨ Новинка'}</span>`).join('')}
                </div>
                <button class="fav-btn ${isFav(p.id) ? 'active' : ''}" data-action="fav" data-id="${p.id}"><i class="fas fa-heart"></i></button>
                <span>${p.icon || '🛒'}</span>
            </div>
            <div class="product-title">${escapeHtml(p.name)}</div>
            <div class="product-desc">${escapeHtml(p.desc)}</div>
            <div class="product-rating">
                <span class="stars">${rating > 0 ? '★'.repeat(Math.round(rating)) + '☆'.repeat(5 - Math.round(rating)) : '☆☆☆☆☆'}</span>
                <span>${rating > 0 ? rating : 'Нет отзывов'}</span>
                ${count > 0 ? `<span>(${count})</span>` : ''}
            </div>
            <div class="product-bottom">
                <div class="price-block">
                    ${oldPrice}
                    <span class="current-price">${p.price} ₽</span>
                    <span class="stock-info ${stockStatus}"><i class="fas fa-${stockStatus === 'in' ? 'check-circle' : 'times-circle'}"></i> ${stockText}</span>
                </div>
                <button class="buy-btn-direct" data-action="buy" data-id="${p.id}" ${p.stock === 0 || !canAfford ? 'disabled' : ''}>
                    <i class="fas fa-shopping-cart"></i> Купить

            </div>
        </div>
    `;
}

function copyToClipboard(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
        if (btn) {
            const orig = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Скопировано';
            btn.classList.add('copied');
            setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 1500);
        }
        showToast('Скопировано в буфер', 'success');
    }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); showToast('Скопировано', 'success'); } catch {}
        document.body.removeChild(ta);
    });
}

function getMethodName(method) { return { card: 'Банковская карта', sbp: 'СБП' }[method] || method; }

function openWithdrawModal(balanceType = 'main') {
    const user = getCurrentUser();
    if (!user) return;
    const balance = balanceType === 'worker' ? (user.workerBalance || 0) : (user.balance || 0);
    $('#modalRoot').innerHTML = `
        <div class="modal-overlay open" id="modalOverlay">
            <div class="modal" style="max-width:500px;">
                <div class="modal-header"><h3><i class="fas fa-money-bill-wave"></i> Вывод</h3><button class="close-btn" id="closeModal"><i class="fas fa-times"></i></button></div>
                <div class="modal-body">
                    <p style="color:var(--text-3); margin-bottom:1rem;">Доступно: <strong style="color:var(--green);">${formatMoney(balance)}</strong></p>
                    <div class="form-group"><label>Способ</label>
                        <div class="pay-methods">
                            <div class="pay-method active" data-method="card"><div class="pay-method-icon">💳</div><div class="pay-method-name">На карту</div></div>
                            <div class="pay-method" data-method="sbp"><div class="pay-method-icon">🏦</div><div class="pay-method-name">СБП</div></div>
                        </div>
                    </div>
                    <div class="form-group"><label>Сумма (₽)</label><input type="number" class="form-input text-input" id="withdrawAmount" placeholder="Сумма" min="10" max="${balance}"></div>
                    <div class="form-group"><label>Реквизиты</label><input type="text" class="form-input text-input" id="withdrawRequisites" placeholder="2200 1234 5678 9012"></div>
                    <div style="background:rgba(251,191,36,0.05); border-left:3px solid #FBBF24; padding:0.8rem; border-radius:0.5rem; margin-bottom:1rem; font-size:0.82rem; color:var(--text-3);"><i class="fas fa-info-circle" style="color:#FBBF24;"></i> Заявка обрабатывается до 24 часов.</div>
                    <button class="btn btn-success" style="width:100%; justify-content:center;" id="confirmWithdrawBtn"><i class="fas fa-paper-plane"></i> Отправить</button>
                </div>
            </div>
        </div>
    `;
    let method = 'card';
    $$('.pay-methods .pay-method').forEach(m => m.onclick = () => { $$('.pay-methods .pay-method').forEach(x => x.classList.remove('active')); m.classList.add('active'); method = m.dataset.method; });
    bindModalClose();
    $('#confirmWithdrawBtn').onclick = () => {
        const amount = parseInt($('#withdrawAmount').value) || 0;
        const reqs = $('#withdrawRequisites').value.trim();
        if (amount < 10) { showToast('Минимум 10₽', 'error'); return; }
        if (amount > balance) { showToast('Недостаточно', 'error'); return; }
        if (!reqs) { showToast('Укажите реквизиты', 'error'); return; }
        const result = balanceType === 'worker' ? withdrawWorkerBalance(user.id, amount, getMethodName(method), reqs) : withdrawFromBalance(user.id, amount, getMethodName(method), reqs);
        if (result.error) { showToast(result.error, 'error'); return; }
        showToast('✅ Заявка создана!', 'success');
        closeModal();
        renderCurrentPage();
    };
}
function withdrawWorkerBalance(userId, amount, method, requisites) {
    const user = getUsers().find(u => u.id === userId);
    if (!user) return { error: 'Не найден' };
    if ((user.workerBalance || 0) < amount) return { error: 'Недостаточно' };
    updateUserBalance(userId, 'worker', -amount);
    addTransaction(userId, 'withdraw', -amount, `Вывод (worker): ${requisites}`, 'worker');
    const reqs = getWithdrawRequests();
    reqs.unshift({ id: genId('wr'), userId, amount, method, requisites, balanceType: 'worker', status: 'pending', time: Date.now() });
    DB.set('withdraw_requests', reqs);
    return { success: true };
}

                <div class="form-group"><label>Новый пароль</label><input type="password" class="form-input text-input" id="newPassword" placeholder="Минимум 4"></div>
                <div class="form-group"><label>Подтверждение</label><input type="password" class="form-input text-input" id="confirmPassword"></div>
                <button class="btn btn-admin" id="changePasswordBtn" style="width:100%; justify-content:center;"><i class="fas fa-shield-alt"></i> Сменить пароль</button>

}

function renderMyOrders() {
    const user = getCurrentUser();
    if (!user) return '<div class="empty-state"><h3>Войдите</h3>';
    const orders = getOrders().filter(o => o.userId === user.id);
    return `
        <section class="section">
            <div class="section-head"><div><h2 class="section-title">Мои <span class="accent">заказы</span></h2></div></div>
            ${orders.length === 0 ? `<div class="empty-state glass" style="padding:3rem; border-radius:1.2rem;"><i class="fas fa-box-open"></i><h3>Нет заказов</h3><p>Пополните баланс и купите</p><button class="btn btn-primary" data-nav="catalog" style="margin-top:1rem;">В каталог</button></div>` : `<div class="orders-list">${orders.map(o => renderOrderCard(o, 'user')).join('')}</div>`}
        </section>
    `;
}

function renderWorkerOrders() {
    const user = getCurrentUser();
    if (!user || user.role !== 'worker') return '<div class="empty-state"><h3>Доступ запрещён</h3></div>';
    const orders = getOrders();
    return `
        <section class="section">
            <div class="section-head"><div><h2 class="section-title">Заказы</h2><p class="section-subtitle">Заработано: <strong style="color:var(--green);">${formatMoney(user.workerBalance || 0)}</strong></p></div></div>
            <div class="orders-list">${orders.filter(o => o.status === 'pending').length === 0 ? '<p style="color:var(--text-3);">Нет доступных заказов</p>' : orders.filter(o => o.status === 'pending').map(o => renderOrderCard(o, 'worker')).join('')}</div>
            <h3 style="margin:2rem 0 1rem;">Мои активные</h3>
            <div class="orders-list">${orders.filter(o => o.workerId === user.id && o.status === 'assigned').map(o => renderOrderCard(o, 'worker')).join('') || '<p style="color:var(--text-3);">Нет активных</p>'}</div>
            <h3 style="margin:2rem 0 1rem;">Завершённые</h3>
            <div class="orders-list">${orders.filter(o => o.workerId === user.id && (o.status === 'worker_done' || o.status === 'completed')).map(o => renderOrderCard(o, 'worker')).join('') || '<p style="color:var(--text-3);">Нет завершённых</p>'}</div>
        </section>
    `;
}

function renderOrderCard(o, view = 'user') {
    const user = getCurrentUser();
    const statusLabels = { pending: 'Ожидает', assigned: 'В работе', worker_done: 'Ждёт', completed: 'Завершён', cancelled: 'Отменён' };
    const worker = o.workerId ? getUsers().find(u => u.id === o.workerId) : null;
    const buyer = getUsers().find(u => u.id === o.userId);
    let actions = `<button class="btn btn-ghost btn-sm" data-action="open-chat" data-id="${o.id}"><i class="fas fa-comments"></i></button>`;
    if (view === 'worker' && o.status === 'pending') actions = `<button class="btn btn-success btn-sm" data-action="take-order" data-id="${o.id}"><i class="fas fa-hand-paper"></i> Взять</button>`;
    if (view === 'worker' && o.status === 'assigned' && o.workerId === user.id) actions += `<button class="btn btn-success btn-sm" data-action="complete-order" data-id="${o.id}"><i class="fas fa-check"></i> Готово</button>`;
    if (view === 'user' && o.status === 'worker_done') actions = `<button class="btn btn-success btn-sm" data-action="confirm-order" data-id="${o.id}"><i class="fas fa-check-double"></i> Получил</button>`;
    if (view === 'user' && o.status === 'completed' && !o.review) actions += `<button class="btn btn-primary btn-sm" data-action="leave-review" data-id="${o.id}"><i class="fas fa-star"></i> Отзыв</button>`;
    return `
        <div class="order-card glass">
            <div class="order-icon">${o.productIcon || '🛒'}</div>
            <div>
                <div class="order-name">${escapeHtml(o.productName)}</div>
                <div class="order-meta">${view === 'user' && worker ? `${worker.name} • ` : ''}${view === 'worker' && buyer ? `${buyer.name} • ` : ''}${timeAgo(o.createdAt)}</div>
            </div>
            <span class="order-status ${o.status}">${statusLabels[o.status]}</span>
            <div class="order-actions">${actions}</div>
        </div>
    `;
}

function renderChats() {
    const user = getCurrentUser();
    if (!user) return '<div class="empty-state"><h3>Войдите</h3>';
    let orders = getOrders();
    if (user.role === 'user') orders = orders.filter(o => o.userId === user.id);
    else if (user.role === 'worker') orders = orders.filter(o => o.workerId === user.id || o.status === 'pending');
    else if (isAdmin()) orders = orders.filter(o => o.chat && o.chat.length > 0);
    if (orders.length === 0) return '<div class="empty-state"><i class="fas fa-comments"></i><h3>Нет чатов</h3></div>';
    if (!state.currentChatId || !orders.find(o => o.id === state.currentChatId)) state.currentChatId = orders[0].id;
    const currentOrder = orders.find(o => o.id === state.currentChatId);
    if (!currentOrder) state.currentChatId = orders[0].id;
    const partner = user.role === 'user' ? getUsers().find(u => u.id === currentOrder.workerId) : getUsers().find(u => u.id === currentOrder.userId);
    return `
        <section class="section">
            <div class="section-head"><div><h2 class="section-title">Чаты <span class="accent">(${orders.length})</span></h2></div></div>
            <div class="chat-container">
                <div class="chat-sidebar glass">
                    <div class="chat-sidebar-header">💬 Диалоги</div>
                    <div class="chat-list">${orders.map(o => { const p = user.role === 'user' ? getUsers().find(u => u.id === o.workerId) : getUsers().find(u => u.id === o.userId); const last = o.chat[o.chat.length - 1]; const cls = o.id === state.currentChatId ? 'active' : ''; return `<div class="chat-list-item ${cls}" data-action="switch-chat" data-id="${o.id}"><div class="chat-list-avatar">${p ? escapeHtml(p.name.charAt(0).toUpperCase()) : '?'}</div><div class="chat-list-info"><div class="chat-list-name">${escapeHtml(p?.name || 'Не назначен')}</div><div class="chat-list-product">${o.productIcon} ${escapeHtml(o.productName)}</div><div class="chat-list-last">${last ? escapeHtml(last.text.substring(0, 30)) : ''}</div></div></div>`; }).join('')}</div>
                </div>
                <div class="chat-main glass" id="chatMain">${renderChatContent(currentOrder, user, partner)}</div>
            </div>
        </section>
    `;
}

function renderChatContent(order, user, partner) {
    const statusLabels = { pending: 'Ожидает', assigned: 'В работе', worker_done: 'Ждёт', completed: 'Завершён' };
    let actions = '';
    const canComplete = (user.role === 'worker' && order.workerId === user.id && order.status === 'assigned') || (isAdmin() && order.status === 'assigned');
    if (canComplete) actions = `<div class="chat-actions"><button class="btn btn-success" data-action="complete-order" data-id="${order.id}" style="flex:1; justify-content:center;"><i class="fas fa-check"></i> Я выполнил</button></div>`;
    if (user.role === 'user' && order.status === 'worker_done') actions = `<div class="chat-actions"><button class="btn btn-success" data-action="confirm-order" data-id="${order.id}" style="flex:1; justify-content:center;"><i class="fas fa-check-double"></i> Подтвердить получение</button></div>`;
    if (user.role === 'user' && order.status === 'completed' && !order.review) actions = `<div class="chat-actions"><button class="btn btn-primary" data-action="leave-review" data-id="${order.id}" style="flex:1; justify-content:center;"><i class="fas fa-star"></i> Отзыв</button></div>`;
    return `
        <div class="chat-header">
            <div class="chat-header-avatar">${partner ? escapeHtml(partner.name.charAt(0).toUpperCase()) : '?'}</div>
            <div class="chat-header-info">
                <div class="chat-header-name">${escapeHtml(partner?.name || 'Не назначен')}</div>
                <div class="chat-header-product">${order.productIcon} ${escapeHtml(order.productName)} • ${order.productPrice} ₽</div>
            </div>
            <span class="chat-status ${order.status}">${statusLabels[order.status]}</span>
        </div>
        <div class="chat-messages" id="chatMessages">${order.chat.map(m => { const cls = m.from === 'system' ? 'system ' + (m.type || '') : (m.from === user.id ? 'out' : 'in'); return `<div class="chat-msg ${cls}">${escapeHtml(m.text)}<div class="chat-msg-time">${formatDate(m.time)}</div></div>`; }).join('')}</div>
        ${order.status !== 'completed' && order.status !== 'cancelled' && (order.workerId || user.role === 'worker' || isAdmin()) ? `<form class="chat-input-area" id="chatForm" data-id="${order.id}"><input type="text" class="chat-input" id="chatInput" placeholder="Сообщение..." autocomplete="off"><button type="submit" class="chat-send"><i class="fas fa-paper-plane"></i></button></form>` : ''}
        ${actions}
    `;
}

/* 🔄 УПРОЩЁННАЯ АДМИНКА (без вкладки заявок пока что — её сделаем отдельно) */

    const completed = orders.filter(o => o.status === 'completed');
    const revenue = completed.reduce((s, o) => s + o.productPrice, 0);
    const users = getUsers();
    const contactReqs = DB.get('contact_requests', []);

                <div class="admin-stat glass"><div class="lbl">💰 Выручка</div><div class="val">${revenue} ₽</div><div class="sub">${completed.length} завершённых</div></div>
                <div class="admin-stat glass"><div class="lbl">👥 Пользователей</div><div class="val">${users.length}</div></div>
                <div class="admin-stat glass"><div class="lbl">🛠 Команда</div><div class="val">${getWorkers().length + getAdmins().length - 1}</div></div>
            </div>
            <div class="admin-tabs">
                <button class="tab-pill ${state.currentAdminTab === 'products' ? 'active' : ''}" data-admin-tab="products"><i class="fas fa-box"></i> Товары</button>
                <button class="tab-pill ${state.currentAdminTab === 'users' ? 'active' : ''}" data-admin-tab="users"><i class="fas fa-users"></i> Пользователи (${users.length})</button>
                <button class="tab-pill ${state.currentAdminTab === 'team' ? 'active' : ''}" data-admin-tab="team"><i class="fas fa-users-cog"></i> Команда</button>
                <button class="tab-pill ${state.currentAdminTab === 'deposits' ? 'active' : ''}" data-admin-tab="deposits"><i class="fas fa-arrow-down"></i> Пополнения (${depositReqs.length})</button>
                <button class="tab-pill ${state.currentAdminTab === 'withdraw' ? 'active' : ''}" data-admin-tab="withdraw"><i class="fas fa-money-bill-wave"></i> Выводы (${withdrawReqs.length})</button>
                ${isSuper ? `<button class="tab-pill ${state.currentAdminTab === 'commission' ? 'active' : ''}" data-admin-tab="commission"><i class="fas fa-percentage"></i> Комиссия</button>` : ''}
                <button class="tab-pill ${state.currentAdminTab === 'settings' ? 'active' : ''}" data-admin-tab="settings"><i class="fas fa-cog"></i> Соцсети</button>
                <button class="tab-pill ${state.currentAdminTab === 'requests' ? 'active' : ''}" data-admin-tab="requests"><i class="fas fa-inbox"></i> Заявки (${newReqs})</button>
            </div>
            <div id="adminTabContent">${renderAdminTabContent()}</div>
        </section>
    `;
}

    if (state.currentAdminTab === 'settings') return renderAdminSettingsTabHTML();

function renderAdminUsersTabHTML() {
    const isSuper = isSuperAdmin();
    let users = getUsers();
    if (state.userRoleFilter !== 'all') users = users.filter(u => u.role === state.userRoleFilter);
    const query = (state.userSearchQuery || '').toLowerCase().trim();
    if (query) {
        users = users.filter(u => 
            (u.username || '').toLowerCase().includes(query) ||
            (u.name || '').toLowerCase().includes(query) ||
            (u.telegram || '').toLowerCase().includes(query)
        );
    }
    users = [...users].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    
    const roleFilterOptions = [
        { id: 'all', name: 'Все', icon: 'fa-users' },
        { id: 'user', name: 'Покупатели', icon: 'fa-user' },
        { id: 'worker', name: 'Работники', icon: 'fa-hard-hat' },
        { id: 'admin', name: 'Админы', icon: 'fa-user-shield' },
        { id: 'superadmin', name: 'Главные', icon: 'fa-crown' },
    ];
    
    return `
        <div class="user-search-bar">
            <input type="search" class="form-input text-input" id="userSearchInput" placeholder="🔍 Поиск по логину, имени или Telegram..." value="${escapeHtml(state.userSearchQuery || '')}" autocomplete="off">

                    <th>Пользователь</th>
                    <th>Логин</th>
                    <th>Telegram</th>
                    <th>Роль</th>
                    <th>Баланс</th>
                    <th>Worker баланс</th>
                    <th>Регистрация</th>
                    <th>Действия</th>
                </tr></thead>
                <tbody>${users.length === 0 ? `<tr><td colspan="8" class="empty-search">😔 Никого не найдено${query ? ` по запросу «${escapeHtml(query)}»` : ''}</td></tr>` : users.map(u => {
                    const roleBadge = u.role === 'superadmin' ? '<span class="role-badge super">👑 Главный</span>' : u.role === 'admin' ? '<span class="role-badge admin">⭐ Админ</span>' : u.role === 'worker' ? '<span class="role-badge worker">🛠 Работник</span>' : '<span class="role-badge user">👤 Покупатель</span>';

                    const canDelete = isSuper && u.role !== 'superadmin';
                    const canDemoteWorker = isAdmin() && u.role === 'worker';
                    return `<tr data-user-row="${u.id}" class="${rowClass}">
                        <td><strong>${escapeHtml(u.name)}</strong></td>
                        <td><code style="background:rgba(0,0,0,0.3); padding:0.2rem 0.4rem; border-radius:4px; font-size:0.85rem;">@${escapeHtml(u.username)}</code></td>

                            ${canDemoteWorker ? `<button class="btn btn-danger btn-sm btn-icon" data-action="demote-worker" data-id="${u.id}" title="Убрать из работников"><i class="fas fa-user-minus"></i></button>` : ''}

function bindPageEvents() {
    $$('[data-nav]').forEach(b => b.onclick = (e) => { e.preventDefault?.(); navigate(b.dataset.nav); });
    $$('[data-cat]').forEach(b => b.onclick = () => { state.currentCategory = b.dataset.cat; renderCurrentPage(); });
    const sort = $('#sortSelect');
    if (sort) { sort.value = state.currentSort; sort.onchange = (e) => { state.currentSort = e.target.value; renderCurrentPage(); }; }
    $$('.product-card').forEach(c => c.onclick = (e) => { if (e.target.closest('[data-action]')) return; openProductModal(parseInt(c.dataset.productId)); });
    $$('[data-action="fav"]').forEach(b => b.onclick = (e) => { e.stopPropagation(); toggleFav(parseInt(b.dataset.id)); });
    $$('[data-action="buy"]').forEach(b => b.onclick = (e) => { e.stopPropagation(); createOrder(parseInt(b.dataset.id)); if (b.dataset.closeModal) closeModal(); });
    $$('[data-action="deposit"]').forEach(b => b.onclick = () => openDepositModal());
    $$('[data-action="withdraw-main"]').forEach(b => b.onclick = () => openWithdrawModal('main'));
    $$('[data-action="withdraw-worker"]').forEach(b => b.onclick = () => openWithdrawModal('worker'));

    const loginForm = $('#loginForm');
    if (loginForm) loginForm.onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(loginForm);
        const user = login(fd.get('username'), fd.get('password'));
        if (user) { showToast('Добро пожаловать, ' + user.name + '!', 'success'); navigate(isAdmin() ? 'admin' : user.role === 'worker' ? 'worker-orders' : 'home'); }
        else showToast('Неверный логин или пароль', 'error');
    };
    const regForm = $('#registerForm');
    if (regForm) regForm.onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(regForm);
        const data = { name: fd.get('name'), username: fd.get('username'), password: fd.get('password'), telegram: fd.get('telegram') };
        const result = register(data);
        if (result.error) showToast(result.error, 'error');
        else { showToast('Аккаунт создан!', 'success'); navigate('home'); }
    };

    const wApplyForm = $('#workerApplyForm');
    if (wApplyForm) wApplyForm.onsubmit = (e) => {
        e.preventDefault();
        const user = getCurrentUser();
        if (!user) return;
        const fd = new FormData(wApplyForm);
        const my = JSON.parse(localStorage.getItem('bf_my_applications') || '[]');
        my.unshift({ userId: user.id, status: 'pending', time: Date.now() });
        localStorage.setItem('bf_my_applications', JSON.stringify(my));
        showToast('✅ Заявка отправлена!', 'success');
        renderCurrentPage();
    };

    const saveProfile = $('#saveProfileBtn');
    if (saveProfile) saveProfile.onclick = () => {
        const user = getCurrentUser();
        const users = getUsers();
        const idx = users.findIndex(u => u.id === user.id);
        users[idx].name = $('#profileName').value;
        users[idx].telegram = $('#profileTelegram').value;
        DB.set('users', users);
        state.currentUser = users[idx];
        DB.set('currentUser', users[idx]);
        showToast('Профиль обновлён!', 'success');
        renderCurrentPage();
    };
    const changePwd = $('#changePasswordBtn');
    if (changePwd) changePwd.onclick = () => {
        const cur = $('#currentPassword').value;
        const nw = $('#newPassword').value;
        const cf = $('#confirmPassword').value;
        if (!cur || !nw || !cf) { showToast('Заполните все поля', 'error'); return; }
        if (nw !== cf) { showToast('Пароли не совпадают', 'error'); return; }
        if (nw.length < 4) { showToast('Минимум 4 символа', 'error'); return; }
        const result = changePassword(cur, nw);
        if (result.error) { showToast(result.error, 'error'); return; }
        showToast('✅ Пароль изменён!', 'success');
        $('#currentPassword').value = ''; $('#newPassword').value = ''; $('#confirmPassword').value = '';
    };
    const cf2 = $('#contactForm');
    if (cf2) cf2.onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(cf2);
        const reqs = DB.get('contact_requests', []);
        reqs.unshift({ id: genId('r'), name: fd.get('name'), contact: fd.get('contact'), subject: fd.get('subject'), message: fd.get('message'), time: Date.now(), read: false, status: 'new' });
        DB.set('contact_requests', reqs);
        showToast('✅ Заявка отправлена!', 'success');
        cf2.reset();
    };

    $$('[data-action="open-chat"]').forEach(b => b.onclick = () => { state.currentChatId = b.dataset.id; navigate('chats'); });
    $$('[data-action="take-order"]').forEach(b => b.onclick = () => { assignWorker(b.dataset.id, getCurrentUser().id); });
    $$('[data-action="complete-order"]').forEach(b => b.onclick = () => { workerCompleteOrder(b.dataset.id); });
    $$('[data-action="confirm-order"]').forEach(b => b.onclick = () => { buyerConfirmOrder(b.dataset.id); });
    $$('[data-action="leave-review"]').forEach(b => b.onclick = () => { openReviewModal(b.dataset.id); });

    const chatForm = $('#chatForm');
    if (chatForm) {
        chatForm.onsubmit = (e) => {
            e.preventDefault();
            const input = $('#chatInput');
            const text = input.value.trim();
            if (!text) return;
            sendMessage(chatForm.dataset.id, text);
            input.value = '';
            renderCurrentPage();
            setTimeout(() => { const cm = $('#chatMessages'); if (cm) cm.scrollTop = cm.scrollHeight; }, 50);
        };
        setTimeout(() => { const cm = $('#chatMessages'); if (cm) cm.scrollTop = cm.scrollHeight; }, 50);
    }
    $$('[data-action="switch-chat"]').forEach(b => b.onclick = () => { state.currentChatId = b.dataset.id; renderCurrentPage(); });

    $$('[data-admin-tab]').forEach(t => t.onclick = () => {
        state.currentAdminTab = t.dataset.adminTab;
        $$('[data-admin-tab]').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        $('#adminTabContent').innerHTML = renderAdminTabContent();
        bindPageEvents();
    });
    $$('[data-team-tab]').forEach(t => t.onclick = () => {
        state.currentTeamTab = t.dataset.teamTab;
        $$('[data-team-tab]').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        $('#teamTabContent').innerHTML = state.currentTeamTab === 'workers' ? renderTeamWorkersHTML() : renderTeamAdminsHTML();
        bindPageEvents();
    });

    const searchInput = $('#userSearchInput');
    if (searchInput) {
        searchInput.oninput = (e) => {
            state.userSearchQuery = e.target.value;
            $('#adminTabContent').innerHTML = renderAdminTabContent();
            bindPageEvents();
            const newInput = $('#userSearchInput');
            if (newInput) {
                newInput.focus();
                newInput.setSelectionRange(state.userSearchQuery.length, state.userSearchQuery.length);
            }
        };
    }
    $$('[data-role-filter]').forEach(p => p.onclick = () => {
        state.userRoleFilter = p.dataset.roleFilter;
        $('#adminTabContent').innerHTML = renderAdminTabContent();
        bindPageEvents();
    });

    $$('[data-action="promote-worker"]').forEach(b => b.onclick = () => {
        if (!confirm('Сделать этого пользователя работником?')) return;
        const users = getUsers();
        const idx = users.findIndex(u => u.id === b.dataset.id);
        if (idx === -1) return;
        users[idx].role = 'worker';
        DB.set('users', users);
        showToast('✅ Пользователь теперь работник!', 'success');
        $('#adminTabContent').innerHTML = renderAdminTabContent();
        bindPageEvents();
    });
    $$('[data-action="promote-admin"]').forEach(b => b.onclick = () => {
        if (!isSuperAdmin()) { showToast('Только главный', 'error'); return; }
        if (!confirm('Сделать этого работника админом?')) return;
        const users = getUsers();
        const idx = users.findIndex(u => u.id === b.dataset.id);
        if (idx === -1) return;
        users[idx].role = 'admin';
        DB.set('users', users);
        showToast('⭐ Пользователь теперь админ!', 'success');
        $('#adminTabContent').innerHTML = renderAdminTabContent();
        bindPageEvents();
    });
    $$('[data-action="demote-worker"]').forEach(b => b.onclick = () => {
        if (!confirm('Убрать из работников?')) return;
        const users = getUsers();
        const idx = users.findIndex(u => u.id === b.dataset.id);
        if (idx === -1) return;
        users[idx].role = 'user';
        DB.set('users', users);
        if (state.currentUser && state.currentUser.id === b.dataset.id) { state.currentUser = users[idx]; DB.set('currentUser', users[idx]); }
        showToast('Пользователь понижен', 'info');
        $('#adminTabContent').innerHTML = renderAdminTabContent();
        bindPageEvents();
    });
    $$('[data-action="delete-user"]').forEach(b => b.onclick = () => {
        if (!isSuperAdmin()) { showToast('Только главный может удалять', 'error'); return; }
        if (!confirm('Удалить пользователя безвозвратно?')) return;
        DB.set('users', getUsers().filter(u => u.id !== b.dataset.id));
        const row = document.querySelector(`tr[data-user-row="${b.dataset.id}"]`);
        if (row) { row.classList.add('row-removing'); setTimeout(() => row.remove(), 300); }
        showToast('Удалён', 'success');
    });

    $$('[data-action="save-product"]').forEach(b => b.onclick = () => {
        const id = parseInt(b.dataset.id);
        const row = document.querySelector(`tr[data-product-row="${id}"]`);
        if (!row) return;
        const products = getProducts();
        const idx = products.findIndex(p => p.id === id);
        if (idx === -1) return;
        const oldName = products[idx].name;
        products[idx].name = row.querySelector('[data-field="name"]').value.trim();
        products[idx].desc = row.querySelector('[data-field="desc"]').value.trim();
        products[idx].cat = row.querySelector('[data-field="cat"]').value;
        products[idx].price = parseInt(row.querySelector('[data-field="price"]').value) || 0;
        DB.set('products', products);
        const priceInput = row.querySelector('[data-field="price"]');
        priceInput.classList.add('price-saved');
        showToast(`✅ Сохранено: ${oldName}`, 'success');
        setTimeout(() => priceInput.classList.remove('price-saved'), 1500);
    });
    $$('[data-action="delete-product"]').forEach(b => b.onclick = () => {
        if (!confirm('Удалить товар?')) return;
        const id = parseInt(b.dataset.id);
        DB.set('products', getProducts().filter(p => p.id !== id));
        const row = document.querySelector(`tr[data-product-row="${id}"]`);
        if (row) { row.classList.add('row-removing'); setTimeout(() => row.remove(), 300); }
        showToast('Товар удалён', 'success');
    });
    $$('[data-action="delete-worker"]').forEach(b => b.onclick = () => {
        if (!confirm('Удалить работника?')) return;
        const id = b.dataset.id;
        DB.set('users', getUsers().filter(u => u.id !== id));
        const row = document.querySelector(`tr[data-worker-row="${id}"]`);
        if (row) { row.classList.add('row-removing'); setTimeout(() => row.remove(), 300); }
        showToast('Удалён', 'success');
    });
    $$('[data-action="delete-admin"]').forEach(b => b.onclick = () => {
        if (!isSuperAdmin()) { showToast('Только главный', 'error'); return; }
        if (!confirm('Удалить админа?')) return;
        const id = b.dataset.id;
        const target = getUsers().find(u => u.id === id);
        if (!target || target.role === 'superadmin') { showToast('Нельзя удалить главного', 'error'); return; }
        DB.set('users', getUsers().filter(u => u.id !== id));
        const row = document.querySelector(`tr[data-admin-row="${id}"]`);
        if (row) { row.classList.add('row-removing'); setTimeout(() => row.remove(), 300); }
        showToast('Админ удалён', 'success');
    });
    $$('[data-action="accept-req"]').forEach(b => b.onclick = () => acceptRequest(b.dataset.id));
    $$('[data-action="reject-req"]').forEach(b => b.onclick = () => rejectRequest(b.dataset.id));
    $$('[data-action="reply-req"]').forEach(b => b.onclick = () => openReplyModal(b.dataset.id));
    $$('[data-action="delete-req"]').forEach(b => b.onclick = () => {
        if (!confirm('Удалить заявку?')) return;
        const id = b.dataset.id;
        DB.set('contact_requests', DB.get('contact_requests', []).filter(r => r.id !== id));
        const row = document.querySelector(`tr[data-req-row="${id}"]`);
        if (row) { row.classList.add('row-removing'); setTimeout(() => row.remove(), 300); }
        showToast('Удалено', 'success');
    });
    $$('[data-action="approve-withdraw"]').forEach(b => b.onclick = () => {
        const reqs = getWithdrawRequests();
        const r = reqs.find(x => x.id === b.dataset.id);
        if (r) { r.status = 'completed'; r.completedBy = getCurrentUser().id; r.completedAt = Date.now(); DB.set('withdraw_requests', reqs); showToast('✅ Выплата подтверждена', 'success'); renderAdminTabInline(); }
    });
    $$('[data-action="reject-withdraw"]').forEach(b => b.onclick = () => {
        if (!confirm('Отменить вывод? Деньги вернутся.')) return;
        const reqs = getWithdrawRequests();
        const r = reqs.find(x => x.id === b.dataset.id);
        if (r) { r.status = 'cancelled'; DB.set('withdraw_requests', reqs); updateUserBalance(r.userId, r.balanceType, r.amount); addTransaction(r.userId, 'refund', r.amount, `Возврат вывода`, r.balanceType); showToast('Отменено', 'info'); renderAdminTabInline(); }
    });
    $$('[data-action="approve-deposit"]').forEach(b => b.onclick = () => {
        const reqs = getDepositRequests();
        const r = reqs.find(x => x.id === b.dataset.id);
        if (!r) return;
        r.status = 'completed';
        r.completedBy = getCurrentUser().id;
        r.completedAt = Date.now();
        DB.set('deposit_requests', reqs);
        depositToBalance(r.userId, r.amount, { card: 'Карта', sbp: 'СБП' }[r.method] || r.method);
        showToast(`✅ Зачислено ${r.amount}₽`, 'success');
        renderAdminTabInline();
    });
    $$('[data-action="reject-deposit"]').forEach(b => b.onclick = () => {
        if (!confirm('Отклонить заявку?')) return;
        const reqs = getDepositRequests();
        const r = reqs.find(x => x.id === b.dataset.id);
        if (!r) return;
        r.status = 'rejected';
        DB.set('deposit_requests', reqs);
        showToast('Отклонено', 'info');
        renderAdminTabInline();
    });

    const aw = $('#addWorkerForm');
    if (aw) aw.onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(aw);
        const users = getUsers();
        if (users.find(u => u.username === fd.get('username'))) { showToast('Логин занят', 'error'); return; }
        const newId = genId('u');
        users.push({ id: newId, username: fd.get('username'), passwordHash: hashPassword(fd.get('password')), role: 'worker', name: fd.get('name'), telegram: fd.get('telegram') || '', avatar: null, balance: 0, workerBalance: 0, createdAt: Date.now() });
        DB.set('users', users);
        showToast('Работник создан!', 'success');
        aw.reset();
        renderCurrentPage();
    };
    const ap = $('#addProductForm');
    if (ap) ap.onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(ap);
        const products = getProducts();
        const newId = Math.max(...products.map(p => p.id), 0) + 1;
        const newProduct = { id: newId, cat: fd.get('cat'), name: fd.get('name'), desc: fd.get('desc'), price: parseInt(fd.get('price')), icon: fd.get('icon') || '🛒', image: fd.get('cat'), stock: 999, badges: ['new'], features: ['Качественно','Быстро','Безопасно'] };
        products.push(newProduct);
        DB.set('products', products);
        showToast('✅ Товар добавлен!', 'success');
        ap.reset();
        renderCurrentPage();
    };
    const aa = $('#addAdminForm');
    if (aa) {
        if (!isSuperAdmin()) aa.style.display = 'none';
        aa.onsubmit = (e) => {
            e.preventDefault();
            if (!isSuperAdmin()) return;
            const fd = new FormData(aa);
            const users = getUsers();
            if (users.find(u => u.username === fd.get('username'))) { showToast('Логин занят', 'error'); return; }
            const newId = genId('u');
            users.push({ id: newId, username: fd.get('username'), passwordHash: hashPassword(fd.get('password')), role: 'admin', name: fd.get('name'), telegram: fd.get('telegram') || '', avatar: null, balance: 0, workerBalance: 0, createdAt: Date.now() });
            DB.set('users', users);
            showToast('⭐ Админ добавлен!', 'success');
            aa.reset();
            renderCurrentPage();
        };
    }
    const sf = $('#settingsForm');
    if (sf) sf.onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(sf);
        const s = getSettings();
        s.tgChannel = fd.get('tgChannel'); s.tgGroup = fd.get('tgGroup'); s.tgSupport = fd.get('tgSupport'); s.discord = fd.get('discord'); s.youtube = fd.get('youtube');
        DB.set('settings', s);
        showToast('Настройки сохранены!', 'success');
    };
    const cf3 = $('#commissionForm');
    if (cf3) cf3.onsubmit = (e) => {
        e.preventDefault();
        const s = getSettings();
        s.commissionPercent = parseInt(new FormData(cf3).get('commissionPercent')) || 0;
        DB.set('settings', s);
        showToast(`✅ Комиссия: ${s.commissionPercent}%`, 'success');
    };
}

function createParticles() {
    const c = $('#particles');
    for (let i = 0; i < 25; i++) {
        const p = document.createElement('div');
        p.classList.add('particle');
        const size = Math.random() * 4 + 1.5;
        p.style.width = size + 'px'; p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 25 + 's';
        p.style.animationDuration = (Math.random() * 15 + 10) + 's';
        p.style.opacity = Math.random() * 0.5 + 0.1;
        const colors = ['rgba(255,165,0,0.4)', 'rgba(168,85,247,0.3)', 'rgba(96,165,250,0.3)'];
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.boxShadow = `0 0 ${size * 2}px currentColor`;
        c.appendChild(p);
    }
}
createParticles();

setInterval(() => {
    if (state.currentPage === 'chats' && state.currentChatId) {
        const cm = $('#chatMessages');
        if (!cm) return;
        const order = getOrders().find(o => o.id === state.currentChatId);
        if (!order) return;
        const user = getCurrentUser();
        if (!user) return;
        const newHtml = order.chat.map(m => { const cls = m.from === 'system' ? 'system ' + (m.type || '') : (m.from === user.id ? 'out' : 'in'); return `<div class="chat-msg ${cls}">${escapeHtml(m.text)}<div class="chat-msg-time">${formatDate(m.time)}</div></div>`; }).join('');
        if (cm.innerHTML !== newHtml) { cm.innerHTML = newHtml; cm.scrollTop = cm.scrollHeight; }
    }
}, 1000);

window.addEventListener('scroll', () => {
    const nav = $('#navbar');
    if (window.scrollY > 30) nav?.classList.add('scrolled');
    else nav?.classList.remove('scrolled');
});

renderCurrentPage();
initCursor();
</script>
</body>
